[package]
name = "caspar-vm-modal"
version = "0.1.0"
edition = "2021"
description = "Caspar VM plugin: Modal cloud sandbox runtime (key: modal)"

[lib]
name = "caspar_vm_modal"
path = "src/lib.rs"

[dependencies]
caspar-vm-sdk = { path = "../../vm-sdk" }
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
# `net` is what makes `enable_all()` actually start the IO driver. Without it
# this crate only builds because something else in the graph happens to turn
# it on — and a runtime with no IO driver cannot open Modal's gRPC channel.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "net"] }
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protox = "0.7"
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }
